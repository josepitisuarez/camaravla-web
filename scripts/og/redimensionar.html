<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Redimensionar foto</title></head>
<body>
<!-- Achica una foto (del mismo sitio) al ancho pedido y la manda a recibir.mjs como JPEG.
     Parámetros: src (ruta relativa a la raíz del sitio) · ancho (por defecto 1200) · archivo · carpeta (por defecto noticias) · calidad (0.82). -->
<p id="estado">procesando…</p>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const img = new Image(); img.src = '../../' + q.get('src');
  await new Promise((ok, mal) => { img.onload = ok; img.onerror = mal; });
  const ancho = Number(q.get('ancho') || 1200), escala = Math.min(1, ancho / img.width);
  const c = document.createElement('canvas'); c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', Number(q.get('calidad') || 0.82)));
  const r = await fetch('http://localhost:3999/guardar?' + new URLSearchParams({ archivo: q.get('archivo'), carpeta: q.get('carpeta') || 'noticias', ext: 'jpg' }), { method: 'POST', body: blob });
  document.getElementById('estado').textContent = `${c.width}×${c.height} → ` + await r.text();
})().catch((e) => { document.getElementById('estado').textContent = 'error: ' + e; });
</script>
</body></html>
